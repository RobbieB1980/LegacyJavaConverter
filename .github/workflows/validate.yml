name: Validate

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run PowerShell regression tests
        shell: powershell
        run: .\tests\Run-RegressionTests.ps1
      - name: Build Windows applications
        run: dotnet build RB.LegacyJavaConverter.slnx --configuration Release
